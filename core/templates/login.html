{% extends 'base.html' %}
{% block title %}管理员登录 · {{site.title}}{% endblock %}
{% block content %}
  <section class="panel auth-panel">
    <span class="auth-icon"><svg><use href="#i-leaf"/></svg></span>
    <h1>欢迎回来</h1>
    <p>登录管理工作台，照顾好每一份学习的小期待。</p>
    {% if error %}
      <div class="notice error" role="alert">{{error}}</div>
    {% endif %}
    <form method="post" action="{{url_for('login')}}">
      <input type="hidden" name="csrf" value="{{csrf()}}">
      <div class="form-field">
        <label for="username">管理员账号</label><input id="username" name="username" autocomplete="username" value="admin" required>
      </div>
      <div class="form-field">
        <label for="password">密码</label><input id="password" type="password" name="password" autocomplete="current-password" placeholder="请输入管理员密码" required>
      </div>
      <button>登录后台 <span aria-hidden="true">→</span></button>
    </form>
  </section>
{% endblock %}
