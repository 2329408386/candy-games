<div class="grade-checkbox-grid">
  {% for grade,label in grades.items() if site.kind != 'workbench' or groups_for_grade(grade) %}
    <fieldset class="grade-group">
      <legend>{{'授权内容' if site.kind == 'workbench' else label}}</legend>
      {% for group in groups_for_grade(grade) %}<label class="game-choice"><input type="checkbox" name="groups" value="{{group.id}}" {% if group.id in selected %}checked{% endif %}><span>{{group.name}} <small>{{'老师工作台' if site.kind == 'workbench' else (group_games(group.id)|length|string) + ' 个游戏'}}</small></span></label>{% endfor %}
    </fieldset>
  {% endfor %}
</div>
