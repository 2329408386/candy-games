{% extends 'base.html' %}
{% block title %}修改管理员密码{% endblock %}
{% block content %}
  <section class="panel auth-panel">
    <span class="auth-icon"><svg><use href="#i-lock"/></svg></span>
    <h1>修改管理员密码</h1>
    <p>所有站点的后台共用这一个密码。保存后，所有设备都要用新密码重新登录。</p>
    {% if error %}
      <div class="notice error" role="alert">{{error}}</div>
    {% endif %}
    <form method="post" action="{{url_for('password')}}">
      <input type="hidden" name="csrf" value="{{csrf()}}">
      <div class="form-field">
        <label for="old">当前密码</label><input id="old" type="password" name="old" autocomplete="current-password" required>
      </div>
      <div class="form-field">
        <label for="password">新密码</label><input id="password" type="password" name="password" minlength="12" autocomplete="new-password" placeholder="至少12位" required>
      </div>
      <div class="form-field">
        <label for="confirm">确认新密码</label><input id="confirm" type="password" name="confirm" minlength="12" autocomplete="new-password" required>
      </div>
      <button>保存密码</button>
    </form>
  </section>
{% endblock %}
