<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="尺子、钟面、罗盘和几何图形组成的数学乐园">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f2f5e9"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#89a77a"/>
      <stop offset="1" stop-color="#5f8167"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d487"/>
      <stop offset="1" stop-color="#e3b458"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#52654a" flood-opacity=".14"/>
    </filter>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="#dbe4d3" stroke-width="1"/>
    </pattern>
  </defs>
  <ellipse cx="326" cy="462" rx="238" ry="30" fill="#dfe7d5" opacity=".65"/>
  <g filter="url(#shadow)">
    <rect x="64" y="44" width="512" height="398" rx="38" fill="url(#paper)" stroke="#e5eadc"/>
    <rect x="86" y="66" width="468" height="354" rx="28" fill="url(#grid)" opacity=".7"/>
  </g>

  <!-- floating number tiles -->
  <g filter="url(#shadow)">
    <rect x="104" y="96" width="64" height="64" rx="18" fill="#e9f0e1" transform="rotate(-8 136 128)"/>
    <text x="136" y="141" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="800" fill="#6d8a63" text-anchor="middle" transform="rotate(-8 136 128)">3</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="468" y="86" width="70" height="70" rx="20" fill="#fbefd8" transform="rotate(9 503 121)"/>
    <text x="503" y="134" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="800" fill="#c19a4e" text-anchor="middle" transform="rotate(9 503 121)">8</text>
  </g>

  <!-- big abacus / counting board -->
  <g filter="url(#shadow)">
    <rect x="210" y="88" width="226" height="164" rx="26" fill="#fffdf7" stroke="#e7e5d9"/>
    <rect x="230" y="108" width="186" height="124" rx="16" fill="#f7f4e8"/>
    <g stroke="#d7d0bd" stroke-width="4" stroke-linecap="round">
      <path d="M246 140h154M246 176h154M246 212h154"/>
    </g>
    <g>
      <circle cx="270" cy="140" r="13" fill="#7f9e72"/>
      <circle cx="310" cy="140" r="13" fill="#f0c96a"/>
      <circle cx="350" cy="140" r="13" fill="#88a9bd"/>
      <circle cx="390" cy="140" r="13" fill="#cc9276"/>
      <circle cx="290" cy="176" r="13" fill="#f0c96a"/>
      <circle cx="330" cy="176" r="13" fill="#7f9e72"/>
      <circle cx="370" cy="176" r="13" fill="#cc9276"/>
      <circle cx="280" cy="212" r="13" fill="#88a9bd"/>
      <circle cx="320" cy="212" r="13" fill="#cc9276"/>
      <circle cx="360" cy="212" r="13" fill="#f0c96a"/>
      <circle cx="400" cy="212" r="13" fill="#7f9e72"/>
    </g>
  </g>

  <!-- ruler -->
  <g filter="url(#shadow)" transform="rotate(-6 320 326)">
    <rect x="146" y="286" width="348" height="76" rx="18" fill="#f4d690"/>
    <rect x="146" y="286" width="348" height="76" rx="18" fill="none" stroke="#e2bc67"/>
    <g stroke="#8b6a34" stroke-width="3" stroke-linecap="round">
      <path d="M174 302v18M202 302v10M230 302v18M258 302v10M286 302v18M314 302v10M342 302v18M370 302v10M398 302v18M426 302v10M454 302v18"/>
    </g>
    <text x="174" y="349" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#8b6a34" text-anchor="middle">0</text>
    <text x="230" y="349" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#8b6a34" text-anchor="middle">1</text>
    <text x="286" y="349" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#8b6a34" text-anchor="middle">2</text>
    <text x="342" y="349" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#8b6a34" text-anchor="middle">3</text>
    <text x="398" y="349" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#8b6a34" text-anchor="middle">4</text>
    <text x="454" y="349" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#8b6a34" text-anchor="middle">5</text>
  </g>

  <!-- compass / clock -->
  <g filter="url(#shadow)">
    <circle cx="154" cy="374" r="66" fill="#fffdf7" stroke="#e7e5d9"/>
    <circle cx="154" cy="374" r="52" fill="#eef3e7"/>
    <g fill="#7a9270" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
      <text x="154" y="336">N</text><text x="192" y="378">E</text><text x="154" y="420">S</text><text x="116" y="378">W</text>
    </g>
    <path d="M154 374 178 350 164 390Z" fill="#cc9276"/>
    <path d="M154 374 130 398 144 358Z" fill="#88a9bd"/>
    <circle cx="154" cy="374" r="6" fill="#52735c"/>
  </g>

  <!-- shapes -->
  <g filter="url(#shadow)">
    <circle cx="494" cy="336" r="42" fill="#e9f0e1" stroke="#7f9e72" stroke-width="4"/>
    <rect x="486" y="376" width="72" height="72" rx="16" fill="#f7e7df" stroke="#cc9276" stroke-width="4" transform="rotate(12 522 412)"/>
    <path d="M456 450 500 378 544 450Z" fill="#e6eef5" stroke="#88a9bd" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- pencil -->
  <g filter="url(#shadow)" transform="rotate(28 548 250)">
    <rect x="532" y="188" width="32" height="126" rx="8" fill="#7f9e72"/>
    <rect x="532" y="188" width="32" height="26" rx="8" fill="#cc9276"/>
    <path d="M532 314h32l-16 28z" fill="#f0c96a"/>
    <path d="M544 330h8l-4 12z" fill="#5b4a3a"/>
  </g>

  <!-- sparkles -->
  <g fill="#e3b458">
    <path d="m108 210 5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/>
    <path d="m548 152 4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/>
    <circle cx="584" cy="438" r="6"/>
    <circle cx="92" cy="296" r="5"/>
  </g>
</svg>
