<form id="lesson-form" class="wb-form lesson-form">
  <div class="wb-row four">
    <label>年级<select name="grade">{% for n in range(1, 7) %}<option value="{{n}}"{{' selected' if n == 3}}>{{n}}年级</option>{% endfor %}</select></label>
    <label>册次<select name="term">{% for t in TERMS %}<option>{{t}}</option>{% endfor %}</select></label>
    <label>课型<select name="kind">{% for k in KINDS %}<option>{{k}}</option>{% endfor %}</select></label>
    <label>课时<select name="periods">{% for n in range(1, limits.periods + 1) %}<option value="{{n}}">{{n}} 课时</option>{% endfor %}</select></label>
  </div>
  <label>课题<input name="topic" maxlength="{{limits.topic}}" required placeholder="例如 荷叶圆圆、习作：我的植物朋友、语文园地四"></label>
  <label>补充说明（选填）<textarea name="notes" rows="2" maxlength="{{limits.notes}}" placeholder="例如：班里学生朗读基础弱；想加一个小组合作环节；用于公开课"></textarea></label>
  <details class="typed-alt">
    <summary>粘贴课文原文（选填，生成得更准确）</summary>
    <label><textarea name="source_text" rows="8" maxlength="{{limits.source}}" placeholder="把课文原文粘贴在这里，教案里引用的句子会以原文为准。"></textarea></label>
  </details>
  <p class="wb-error" role="alert"></p>
  <button>{{submit_label or '生成教案'}}</button>
</form>
