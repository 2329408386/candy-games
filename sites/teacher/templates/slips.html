<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{klass.name}} 登录条</title>
    <style>
      body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;margin:16px;color:#222}
      .bar{display:flex;gap:12px;align-items:center;margin-bottom:16px}
      .slips{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0}
      .slip{border:1px dashed #999;padding:12px 14px;break-inside:avoid;line-height:1.7}
      .slip strong{font-size:18px}
      code{font-size:17px;letter-spacing:1px}
      @media print{.bar{display:none}body{margin:0}}
    </style>
  </head>
  <body>
    <div class="bar"><button onclick="print()">打印</button><span>沿虚线剪开，每人一张。</span></div>
    <div class="slips">
      {% for s in students %}
        <div class="slip">
          <strong>{{s.name}}</strong><br>
          网址：{{request.host_url.rstrip('/')}}{{url_for('home')}}<br>
          班级码：<code>{{klass.code}}</code><br>
          口令：<code>{{s.pin}}</code>
        </div>
      {% endfor %}
    </div>
  </body>
</html>
