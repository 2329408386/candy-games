<div class="photo-picker" data-max="{{photo_limit}}">
  <div class="photo-list"></div>
  <label class="photo-add">
    <svg><use href="#i-camera"/></svg>
    <span>拍照或选照片</span>
    <small><strong>一页拍一张，不要把两页拍在一张里</strong>（最多 {{photo_limit}} 张），按顺序拍。拍正、拍全、光线亮一点。选好后把作文纸以外的部分裁掉，横着的照片点“转一下”转正。</small>
    <input type="file" accept="image/*" multiple hidden>
  </label>
</div>
