<form id="assignment-form" class="wb-form">
  <label>作文题目<input name="title" maxlength="40" required value="{{a.title if a else ''}}" placeholder="例如 我的植物朋友"></label>
  <div class="wb-row">
    <label>文体<select name="genre">{% for g in GENRES %}<option{{' selected' if a and a.genre == g}}>{{g}}</option>{% endfor %}</select></label>
    <label>字数要求<input name="min_chars" type="number" min="0" max="2000" value="{{a.min_chars if a and a.min_chars else ''}}" placeholder="不少于多少字（可不填）"></label>
    <label>截止日期<input name="due" type="date" value="{{a.due_at|date if a else ''}}"></label>
  </div>
  <label>习作要求（AI 会按这个批改）<textarea name="requirement" rows="4" maxlength="600" placeholder="例如：选一种植物，按一定顺序写出它的样子和特点，写出你对它的喜爱。可以写观察日记里的发现。">{{a.requirement if a else ''}}</textarea></label>
  <label class="check"><input type="checkbox" name="auto_publish"{{' checked' if a and a.auto_publish}}> AI 批改完直接发给学生（不勾选：老师审核后再发布）</label>
  <p class="wb-error" role="alert"></p>
  <button>{{'保存' if a else '布置'}}</button>
</form>
