{% extends 'base.html' %}
{% block content %}
  <section class="wb-hero">
    <h1>语文老师工作台</h1>
    <p>小学作文 AI 批改：学生交作文，AI 先批一遍，老师看过再发给学生。</p>
  </section>
  <div class="wb-entry">
    <section class="wb-card">
      <h2>我是学生</h2>
      <p class="muted">用老师发的登录条登录。</p>
      <form id="student-login" class="wb-form">
        <label>班级码<input name="code" autocomplete="off" autocapitalize="characters" maxlength="10" required placeholder="6 位字母和数字"></label>
        <label>姓名<input name="name" maxlength="12" required placeholder="和老师名单上一样"></label>
        <label>口令<input name="pin" inputmode="numeric" maxlength="4" required placeholder="4 位数字"></label>
        <p class="wb-error" role="alert"></p>
        <button>登录</button>
      </form>
    </section>
    <section class="wb-card">
      <h2>我是老师</h2>
      <p class="muted">输入老师授权码开始使用。</p>
      <form id="teacher-activate" class="wb-form">
        <label>授权码<input name="key" autocomplete="off" autocapitalize="characters" maxlength="24" required placeholder="16 位授权码"></label>
        <p class="wb-error" role="alert"></p>
        <button>激活</button>
      </form>
      <p class="hint">还没有授权码？请联系管理员。</p>
    </section>
  </div>
{% endblock %}
{% block scripts %}
  <script>
    WB.form('#student-login', '{{url_for("student_login")}}', () => location.reload());
    WB.form('#teacher-activate', '{{url_for("activate")}}', () => location.reload());
  </script>
{% endblock %}
