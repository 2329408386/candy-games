<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="字母积木、对话气泡和彩色铅笔组成的英语乐园">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#eef3f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#3f5470" flood-opacity=".14"/>
    </filter>
    <pattern id="lines" width="26" height="30" patternUnits="userSpaceOnUse">
      <path d="M0 29H26" fill="none" stroke="#d6e0ec" stroke-width="1"/>
    </pattern>
  </defs>
  <ellipse cx="326" cy="462" rx="238" ry="30" fill="#d9e3ef" opacity=".65"/>
  <g filter="url(#shadow)">
    <rect x="64" y="44" width="512" height="398" rx="38" fill="url(#paper)" stroke="#dfe6ef"/>
    <rect x="86" y="66" width="468" height="354" rx="28" fill="url(#lines)" opacity=".8"/>
  </g>

  <!-- speech bubbles -->
  <g filter="url(#shadow)">
    <path d="M128 104h176a22 22 0 0 1 22 22v62a22 22 0 0 1-22 22h-118l-30 26 4-26h-32a22 22 0 0 1-22-22v-62a22 22 0 0 1 22-22z" fill="#fff" stroke="#d3deeb" stroke-width="2"/>
    <text x="216" y="170" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="44" font-weight="800" fill="#4a6fa5" text-anchor="middle">Hello!</text>
  </g>
  <g filter="url(#shadow)">
    <path d="M362 142h150a20 20 0 0 1 20 20v50a20 20 0 0 1-20 20h-24l4 24-28-24h-102a20 20 0 0 1-20-20v-50a20 20 0 0 1 20-20z" fill="#fbefd8" stroke="#efdcb5" stroke-width="2"/>
    <text x="437" y="198" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="30" font-weight="800" fill="#b98a3c" text-anchor="middle">Hi, I'm Amy.</text>
  </g>

  <!-- alphabet blocks -->
  <g filter="url(#shadow)">
    <rect x="150" y="300" width="96" height="96" rx="18" fill="#e9eff8" stroke="#cdd9ea" stroke-width="2"/>
    <text x="198" y="371" font-family="Arial, sans-serif" font-size="62" font-weight="800" fill="#4a6fa5" text-anchor="middle">A</text>
  </g>
  <g filter="url(#shadow)" transform="rotate(-7 304 330)">
    <rect x="256" y="282" width="96" height="96" rx="18" fill="#fbe6dc" stroke="#efcdbc" stroke-width="2"/>
    <text x="304" y="353" font-family="Arial, sans-serif" font-size="62" font-weight="800" fill="#c0745a" text-anchor="middle">b</text>
  </g>
  <g filter="url(#shadow)" transform="rotate(6 410 344)">
    <rect x="362" y="296" width="96" height="96" rx="18" fill="#e3f0e6" stroke="#c6dfcc" stroke-width="2"/>
    <text x="410" y="367" font-family="Arial, sans-serif" font-size="62" font-weight="800" fill="#5c8e68" text-anchor="middle">C</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="216" y="222" width="72" height="72" rx="16" fill="#fbefd8" stroke="#efdcb5" stroke-width="2"/>
    <text x="252" y="274" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#b98a3c" text-anchor="middle">d</text>
  </g>

  <!-- pencils -->
  <g filter="url(#shadow)" transform="rotate(28 528 300)">
    <rect x="512" y="238" width="30" height="120" rx="8" fill="#e07a6a"/>
    <rect x="512" y="238" width="30" height="24" rx="8" fill="#f1b3a6"/>
    <path d="M512 358h30l-15 26z" fill="#f0c96a"/>
    <path d="M523 373h8l-4 11z" fill="#5b4a3a"/>
  </g>
  <g filter="url(#shadow)" transform="rotate(-24 116 330)">
    <rect x="100" y="270" width="28" height="112" rx="8" fill="#6f95c9"/>
    <rect x="100" y="270" width="28" height="22" rx="8" fill="#b9cde8"/>
    <path d="M100 382h28l-14 24z" fill="#f0c96a"/>
    <path d="M110 396h8l-4 10z" fill="#5b4a3a"/>
  </g>

  <!-- stars -->
  <g fill="#e3b458">
    <path d="m546 92 5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/>
    <path d="m104 236 4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/>
    <circle cx="584" cy="438" r="6"/>
    <circle cx="350" cy="110" r="5"/>
  </g>
</svg>
