        :root {

            --p1-bg: #e0f3ff;

            --p2-bg: #ffe5e9;
            --text-dark: #2c3e50;
            --correct: #2ecc71;
            --wrong: #e74c3c;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'ZCOOL KuaiLe', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff; height: 100vh;
            display: flex; flex-direction: column;
            overflow: hidden; user-select: none;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 40px; background: rgba(0,0,0,0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            height: 10vh; min-height: 80px;
        }

        .title { font-size: 2.5rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); color: #FFD700; }
        .timer-box { font-size: 3rem; background: #fff; color: #ff4757; padding: 5px 30px; border-radius: 50px; box-shadow: 0 0 20px rgba(255, 255, 255, 0.5); font-weight: bold; }

        .game-container { display: flex; flex: 1; padding: 15px; gap: 15px; height: 90vh; }
        .player-panel { flex: 1; border-radius: 30px; display: flex; flex-direction: column; padding: 15px; position: relative; transition: all 0.3s ease; }

        .player-1 { background: linear-gradient(180deg, #ffffff 0%, var(--p1-bg) 100%); border: 8px solid var(--p1-color); }
        .player-2 { background: linear-gradient(180deg, #ffffff 0%, var(--p2-bg) 100%); border: 8px solid var(--p2-color); }

        .player-header { display: flex; justify-content: space-between; align-items: center; font-size: 1.8rem; color: var(--text-dark); margin-bottom: 10px; }
        .score-display { font-size: 2.5rem; font-weight: bold; color: #ff4757; background: #fff; padding: 5px 20px; border-radius: 20px; box-shadow: 0 4px 0 #ddd; }

        .rule-tag { background: #f1c40f; color: #fff; padding: 5px 15px; border-radius: 15px; font-size: 1.2rem; display: inline-block; box-shadow: 0 4px 0 #d4ac0d; text-align: center; margin-bottom: 10px; }

        .question-area {
            background: white; border-radius: 20px; padding: 20px; font-size: 2rem; 
            color: var(--text-dark); line-height: 1.8; flex: 1; 
            display: flex; align-items: center; justify-content: center;
            text-align: center; box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
            margin-bottom: 10px; flex-wrap: wrap; align-content: center;
            position: relative;
        }

        .waiting-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); border-radius: 20px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 2.5rem; color: #f39c12; font-weight: bold; z-index: 10;
        }

        .tray-container { display: flex; flex-direction: column; gap: 8px; }
        .action-row { display: flex; gap: 8px; justify-content: center; }
        .action-btn {
            color: white; border: none; padding: 8px 15px; border-radius: 12px; 
            font-size: 1.2rem; font-family: inherit; cursor: pointer; transition: all 0.1s;
            flex: 1;
        }
        .btn-submit { background: #2ecc71; box-shadow: 0 4px 0 #27ae60; font-size: 1.4rem; flex: 2; }
        .action-btn:active { transform: translateY(4px); box-shadow: 0 0px 0 #ccc; }

        .float-score {
            position: absolute; font-size: 3rem; font-weight: bold; color: #FFD700;
            text-shadow: 2px 2px 0 #d35400; pointer-events: none;
            animation: floatUp 1.5s ease-out forwards; z-index: 50;
        }

        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }
        .hidden { display: none !important; }
        .start-btn {
            font-size: 3rem; padding: 20px 60px; border-radius: 50px; background: #f1c40f;
            color: #fff; border: none; cursor: pointer; box-shadow: 0 10px 0 #d4ac0d;
            font-family: inherit; transition: all 0.1s; margin-top: 30px;
        }
        .start-btn:active { transform: translateY(10px); box-shadow: 0 0px 0 #d4ac0d; }

        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-8px); } 100% { transform: translateX(0); } }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(0.5); } 100% { opacity: 0; transform: translateY(-100px) scale(1.5); } }

        * { box-sizing: border-box; }
        .header { flex-shrink: 0; height: auto; min-height: 80px; }
        .game-container { height: auto; min-height: 0; }
        .player-panel { min-width: 0; min-height: 0; }
        .question-area { display: block; align-content: center; overflow-y: auto; min-height: 0; }
        .feedback { min-height: 28px; text-align: center; color: var(--text-dark); }
        .instructions { font-size: 1.1rem; line-height: 1.8; text-align: center; }
        .overlay-screen { position: fixed; overflow-y: auto; padding: 24px; text-align: center; }
        .overlay-screen h1 { font-size: clamp(2rem, 6vw, 5rem) !important; }
        button:disabled { cursor: default; opacity: 0.5; }
        button:focus-visible { outline: 3px solid #e67e22; outline-offset: 3px; }
        @media (max-width: 900px), (max-height: 700px) {
            .header { padding: 8px 18px; min-height: 60px; }
            .title { font-size: 1.8rem; }
            .timer-box { font-size: 2rem; }
            .header > div:last-child { display: none; }
            .game-container { padding: 8px; gap: 8px; }
            .player-panel { padding: 10px; border-width: 4px; border-radius: 20px; }
            .player-header, .question-area { font-size: 1.4rem; }
            .question-area { padding: 12px; line-height: 2; }
            .score-display { font-size: 1.8rem; padding: 3px 12px; }
            .action-btn { padding: 8px 4px; font-size: 1rem; }
        }
        @media (max-width: 550px) {
            body { overflow-y: auto; height: auto; min-height: 100vh; }
            .game-container { flex-direction: column; }
            .player-panel { min-height: 380px; }
            .question-area { min-height: 120px; }
        }

        .question-area { text-align: left; align-content: start; padding: 20px; }
        .question-text { font-size: clamp(1.2rem, 2vw, 1.8rem); line-height: 1.6; margin: 0 0 18px; }
        .options { display: grid; gap: 10px; }
        .option { width: 100%; padding: 12px 16px; border: 2px solid #dce5ee; border-radius: 14px; background: #f7fafc; color: var(--text-dark); font: inherit; font-size: clamp(1.05rem, 1.6vw, 1.4rem); text-align: left; line-height: 1.4; cursor: pointer; overflow-wrap: anywhere; }
        .option:hover:not(:disabled) { background: #fff6d7; }
        .option.selected { border-color: #d4a500; background: #fff2bd; }
        .option.correct { border-color: #148448; background: #e1f8e9; }
        .option.wrong { border-color: #c6372d; background: #ffebe8; }
        .option:disabled { opacity: 1; cursor: default; }
        .feedback { flex-shrink: 0; min-height: 74px; font-size: 1rem; line-height: 1.5; padding: 6px 4px; }
        .rule-tag { font-size: 1rem; color: #493800; }
        .waiting-overlay { font-size: 2rem; text-align: center; }
        .instructions { max-width: 850px; }
        @media (max-height: 700px) and (min-width: 551px) {
            .question-area { padding: 12px; }
            .question-text { margin-bottom: 10px; font-size: 1.2rem; }
            .option { padding: 7px 10px; font-size: 1.05rem; }
            .options { gap: 6px; }
            .feedback { min-height: 60px; font-size: .9rem; }

            .player-panel { min-height: 490px; }
            .question-area { overflow-y: visible; }
            .overlay-screen { justify-content: flex-start; }
            .start-btn { font-size: 2rem; padding: 16px 36px; }

        function startGame() {
            if (gameStarted) return;
            gameStarted = true;
            timeLeft=GameExperience.getDuration();
            const roundDeadline=GameExperience.startRound();
            document.getElementById('timer').textContent=timeLeft+'s';
            const rounds = drawRound();
            for (const player of [1, 2]) {
                players[player] = { questions: rounds[player - 1], index: 0, score: 0, combo: 0, locked: false, selected: null };
            }
            for (const player of [1, 2]) loadQuestionForPlayer(player);
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            timerInterval = setInterval(() => {
                timeLeft=GameExperience.remaining();
                document.getElementById('timer').textContent = timeLeft + 's';
                if (timeLeft <= 0) endGame();
            }, 1000);
        }
        function optionsFor(player) {
            return [...document.querySelectorAll(`#question-${player} .option`)];
        }
        function setControls(player, disabled) {
            document.querySelectorAll(`#panel-${player} button`).forEach(button => button.disabled = disabled);
        }
        function loadQuestionForPlayer(player) {
            if (isGameOver) return;
            const state = players[player];
            const q = state.questions[state.index];
            state.selected = null;
            document.getElementById(`feedback-${player}`).textContent = '';
            const area = document.getElementById(`question-${player}`);
            area.replaceChildren();
            area.scrollTop = 0;
            if (!q) {
                state.locked = true;
                document.getElementById(`rule-${player}`).textContent = '已完成 20 / 20 题';
                area.innerHTML = '<div class="waiting-overlay">已完成所有题目<br>等待对手…</div>';
                setControls(player, true);
                if ([1, 2].every(p => players[p].index >= ROUND_SIZE)) endGame();
                return;
            }
            state.locked = false;
            document.getElementById(`rule-${player}`).textContent = `${q.book} · ${q.type === 'choice' ? '单选题' : '判断题'} · ${state.index + 1} / 20`;
            const text = document.createElement('p');
            text.className = 'question-text';
            text.textContent = q.text;
            const options = document.createElement('div');
            options.className = 'options';
            options.setAttribute('role', 'group');
            options.setAttribute('aria-label', '请选择一个答案');
            q.options.forEach((label, index) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'option';
                button.textContent = q.type === 'choice' ? `${'ABCD'[index]}. ${label}` : label;
                button.setAttribute('aria-pressed', 'false');
                button.onclick = () => chooseAnswer(player, index);
                options.appendChild(button);
            });
            area.append(text, options);
            setControls(player, false);
        }
        function canEdit(player) { if(GameExperience.expired())return false;
            return gameStarted && !isGameOver && players[player] && !players[player].locked;
        }
        function chooseAnswer(player, index) {
            if (!canEdit(player)) return;
            const state = players[player];
            if (!Number.isInteger(index) || index < 0 || index >= state.questions[state.index].options.length) return;
            state.selected = index;
            optionsFor(player).forEach((button, i) => {
                button.classList.toggle('selected', i === index);
                button.setAttribute('aria-pressed', String(i === index));
            });
            document.getElementById(`feedback-${player}`).textContent = '';
        }
        function submitAnswer(player) { if(GameExperience.expired())return;
            if (!canEdit(player)) return;
            const state = players[player];
            const feedback = document.getElementById(`feedback-${player}`);
            if (state.selected === null) {
                feedback.textContent = '请先选择一个答案哦！';
                return;
            }
            state.locked = true;
            setControls(player, true);
            const q = state.questions[state.index];
            const correct = state.selected === q.answer;
            optionsFor(player).forEach((button, i) => {
                button.classList.remove('selected');
                if (i === q.answer) {
                    button.classList.add('correct');
                    button.textContent += ' ✓ 正确答案';
                } else if (i === state.selected) {
                    button.classList.add('wrong');
                    button.textContent += ' ✗';
                }
            });
            GameExperience.result(correct,{player,combo:correct?state.combo+1:0});
            let prefix;
            if (correct) {
                state.combo++;
                const added = 10 + (state.combo > 1 ? 5 : 0);
                state.score += added;
                prefix = state.combo > 1 ? '答对了！连击奖励 +5 分。' : '答对了！';
                showFloatScore(player, `+${added}`, '#FFD700');
            } else {
                state.combo = 0;
                const deducted = Math.min(5, state.score);
                state.score -= deducted;
                prefix = `正确答案：${q.type === 'choice' ? 'ABCD'[q.answer] + '. ' : ''}${q.options[q.answer]}。`;
                showFloatScore(player, `-${deducted}`, '#e74c3c');
            }
            feedback.textContent = prefix + ' ' + q.explanation;
            document.getElementById(`score-${player}`).textContent = state.score;
            later(() => {
                state.index++;
                loadQuestionForPlayer(player);
            }, correct ? 2000 : 3000);
        }
        function showFloatScore(player, text, color) {
            const panel = document.getElementById(`panel-${player}`);
            const el = document.createElement('div');
            el.className = 'float-score';
            el.textContent = text;
            el.style.color = color;
            el.style.left = '45%';
            el.style.top = '40%';
            panel.appendChild(el);
            later(() => el.remove(), 1500);
        }
        function endGame() { GameExperience.endRound();
            if (isGameOver) return;
            isGameOver = true;
            clearInterval(timerInterval);
            pendingTimers.forEach(id => clearTimeout(id));
            pendingTimers.clear();
            for (const player of [1, 2]) setControls(player, true);
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('final-score').textContent = `玩家一：${players[1].score} 分  |  玩家二：${players[2].score} 分`;
            const winner = document.getElementById('winner-text');
            if (players[1].score === players[2].score) {
                winner.textContent = '🤝 势均力敌，平局！';
                winner.style.color = '#FFD700';
            } else {
                const firstWins = players[1].score > players[2].score;
                winner.textContent = firstWins ? '玩家一获胜！' : '玩家二获胜！';
                winner.style.color = firstWins ? '#4facfe' : '#ff6b81';
            }
        }
    </script>
</body>
</html>
