            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            for (const player of [1, 2]) {
                players[player] = { questions: shuffled.slice((player - 1) * 20, player * 20), index: 0, score: 0, combo: 0, locked: false, active: null };
                const tray = document.getElementById(`tray-${player}`);
                answerOptions.forEach(answer => {

                loadQuestionForPlayer(player);

            document.getElementById('start-screen').classList.add('hidden');

            timerInterval = setInterval(() => {
                timeLeft=GameExperience.remaining();
                document.getElementById('timer').textContent = timeLeft + 's';
                if (timeLeft <= 0) endGame();

            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('final-score').textContent = `玩家一：${players[1].score} 分  |  玩家二：${players[2].score} 分`;
            const winner = document.getElementById('winner-text');
            if (players[1].score === players[2].score) {
                winner.textContent = '🤝 势均力敌，平局！';
                winner.style.color = '#FFD700';
            } else {
                const firstWins = players[1].score > players[2].score;
                winner.textContent = firstWins ? '玩家一获胜！' : '玩家二获胜！';
                winner.style.color = firstWins ? '#4facfe' : '#ff6b81';
            }
        }
    </script>
</body>
</html>
