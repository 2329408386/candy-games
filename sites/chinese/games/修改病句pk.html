            if (e.kind === 'swap') {
                if (!e.first || e.second) { e.first = id; delete e.second; }
                else if (id !== e.first) e.second = id;
            } else { e.target = id; delete e.value; }
            document.getElementById(`feedback-${player}`).textContent = '';
            renderEditor(player);
        }
        function selectGap(player, position) {
            if (!canEdit(player) || players[player].edit.kind !== 'insert') return;
            const q = currentQuestion(player);
            if (![...q.tokens.map(t=>t.start), q.original.length].includes(position)) return;
            players[player].edit = {kind:'insert', position};
            document.getElementById(`feedback-${player}`).textContent = '';
            renderEditor(player);
        }
        function selectWord(player, value) {
            if (!canEdit(player) || !players[player].cards.includes(value)) return;
            const e = players[player].edit;
            if ((e.kind === 'replace' && e.target) || (e.kind === 'insert' && e.position !== undefined)) {
                e.value = value; document.getElementById(`feedback-${player}`).textContent = ''; renderEditor(player);
            }
        }
        function clearEdit(player) {
            if (!canEdit(player)) return;
            players[player].edit = {}; document.getElementById(`feedback-${player}`).textContent = ''; renderEditor(player);
        }
        function isComplete(e) {
            if (e.kind === 'replace') return !!(e.target && e.value);
            if (e.kind === 'insert') return e.position !== undefined && !!e.value;
            if (e.kind === 'delete') return !!e.target;
            return e.kind === 'swap' && !!e.first && !!e.second && e.first !== e.second;
        }
        function applyEdit(q, e) {
            if (!isComplete(e)) return null;
            if (e.kind === 'insert') return q.original.slice(0,e.position)+e.value+q.original.slice(e.position);
            if (e.kind === 'swap') {
                const a=q.tokens.find(t=>t.id===e.first), b=q.tokens.find(t=>t.id===e.second);
                if (!a || !b) return null;
                return q.tokens.map(t=>t.id===a.id?b.text:t.id===b.id?a.text:t.text).join('');
            }
            return q.tokens.map(t=>t.id===e.target?(e.kind==='delete'?'':e.value):t.text).join('');
        }
        function matchesAnswer(q, e) {
            if (!isComplete(e)) return false;
            return q.accepted.some(a => {
                if (a.kind !== e.kind) return false;
                if (a.kind === 'swap') return (a.first===e.first && a.second===e.second)||(a.first===e.second && a.second===e.first);
                return Object.keys(a).every(key => a[key]===e[key]);
            });
        }
        function renderEditor(player) {
            const s=players[player], q=currentQuestion(player), e=s.edit;
            const area=document.getElementById(`question-${player}`), scroll=area.scrollTop;
            area.replaceChildren();
            const source = document.createElement('div');
            source.className = 'question-source';
            source.textContent = `第 ${s.index + 1} / ${s.questions.length} 题 · 《${q.provenance.lesson}》 · 原句单处设错`;
            area.append(source);
            const hint=document.createElement('p'); hint.className='edit-hint';
            hint.textContent = !e.kind ? '用修改符号改正下面的句子。先点下方符号。' : e.kind==='insert' ? '点字词之间的短线，再选要添的字词。' : e.kind==='swap' ? '依次点两个要交换位置的字词块。' : e.kind==='delete' ? '点要去掉的字词块。' : '点要换的字词块，再选新的字词。';
            const board=document.createElement('div');board.className='edit-board';board.id=`board-${player}`;
            function gap(position) {
                const wrap=document.createElement('span');wrap.className='gap-wrap';
                const button=document.createElement('button');button.className='gap'+(e.kind==='insert'?' insertable':'');
                button.setAttribute('aria-label',`在第${position}字后插入`);button.dataset.position=position;
                button.disabled=e.kind!=='insert';button.tabIndex=e.kind==='insert'?0:-1;
                button.onclick=()=>selectGap(player,position);
                wrap.append(button);
                if (e.kind==='insert' && e.position===position) {button.classList.add('selected');addMark(wrap,'insert',e.value);}
                board.append(wrap);
            }
            for (const token of q.tokens) {
                gap(token.start);
                const wrap=document.createElement('span');wrap.className='word-wrap';
                const button=document.createElement('button');button.className='word';button.textContent=token.text;button.dataset.token=token.id;
                button.setAttribute('aria-label',`第${token.start+1}字起：${token.text}`);button.onclick=()=>selectTarget(player,token.id);wrap.append(button);
                if (e.target===token.id || e.first===token.id || e.second===token.id) {
                    button.classList.add('selected');
                    if (e.kind!=='swap') addMark(wrap,e.kind,e.value);
                    else { const order=document.createElement('span');order.className='annotation';order.textContent=e.first===token.id?'①':'②';wrap.append(order); }
                }
                board.append(wrap);
            }
            gap(q.original.length);
            area.append(hint,board);
            const needsCards=(e.kind==='replace' && e.target)||(e.kind==='insert' && e.position!==undefined);
            if(needsCards) {
                const cards=document.createElement('div');cards.className='word-cards';cards.setAttribute('aria-label','可用字词');
                s.cards.forEach(value=>{const b=document.createElement('button');b.className='word-card'+(e.value===value?' selected':'');b.textContent=value;b.onclick=()=>selectWord(player,value);cards.append(b);});
                area.append(cards);
            }
            const result=applyEdit(q,e);
            if(result!==null) {const preview=document.createElement('p');preview.className='preview';preview.textContent='改后：'+result;area.append(preview);}
            document.querySelectorAll(`#symbols-${player} button`).forEach(b=>{b.classList.toggle('selected',b.dataset.kind===e.kind);b.setAttribute('aria-pressed',String(b.dataset.kind===e.kind));});
            if(s.locked || isGameOver) setControls(player,true);
            else document.querySelectorAll(`#tray-container-${player} button`).forEach(b=>b.disabled=false);
            area.scrollTop=scroll;
            if(e.kind==='swap' && e.first && e.second) requestAnimationFrame(()=>drawSwap(player));
        }
        function addMark(wrap,kind,value) {
            if (kind === 'delete') {
                wrap.insertAdjacentHTML('beforeend', '<svg class="mark-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="49" width="94" height="48" rx="24"/><path d="M48 49C59 30 75 25 68 40C61 52 52 32 69 25C90 13 93 33 83 34C72 34 77 9 93 9H99"/></svg>');
            } else {
                const outline = kind === 'replace' ? '<rect x="3" y="49" width="94" height="48" rx="24"/><path d="M25 49V16H50"/>' : '<path d="M10 90L50 55L90 90 M50 55V16H75"/>';
                wrap.insertAdjacentHTML('beforeend', `<svg class="mark-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5">${outline}</svg>`);
                const label=document.createElement('span');label.className='annotation correction-label';label.textContent=value || '　';wrap.append(label);
            }
        }
        function drawSwap(player) {
            const board=document.getElementById(`board-${player}`), e=players[player]?.edit;
            if(!board) return;
            board.querySelector('.swap-lines')?.remove();
            if(e?.kind!=='swap' || !e.first || !e.second) return;
            const a=board.querySelector(`[data-token="${e.first}"]`),b=board.querySelector(`[data-token="${e.second}"]`);
            if(!a || !b) return;
            const r=board.getBoundingClientRect(),ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();
            const x1=ar.left-r.left+ar.width/2,y1=ar.top-r.top-3,x2=br.left-r.left+br.width/2,y2=br.top-r.top-3;
            const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('swap-lines');svg.setAttribute('aria-hidden','true');
            const left = ar.left <= br.left ? ar : br, right = ar.left <= br.left ? br : ar;
            const mid = (left.right + right.left) / 2 - r.left;
            const route = Math.abs(y1-y2)<10
                ? `M${left.left-r.left} ${left.top-r.top}V${left.bottom-r.top+4}H${mid}V${right.top-r.top-18}H${right.right-r.left}V${right.bottom-r.top+4}`
                : `M${ar.left-r.left} ${ar.top-r.top}V${ar.bottom-r.top+4}H4V${br.top-r.top-18}H${br.right-r.left}V${br.bottom-r.top+4}`;
            svg.innerHTML=`<path d="${route}" fill="none" stroke="currentColor" stroke-width="2"/>`;
            board.append(svg);
        }
        window.addEventListener('resize',()=>{if(gameStarted) [1,2].forEach(drawSwap);});
        function submitAnswer(player) { if(GameExperience.expired())return;
            if(!canEdit(player)) return;
            const s=players[player],q=currentQuestion(player),feedback=document.getElementById(`feedback-${player}`);
            if(!isComplete(s.edit)) {feedback.textContent='还没修改完成，请选好符号、位置和需要的字词。';return;}
            const correct=matchesAnswer(q,s.edit), userResult=applyEdit(q,s.edit);
            s.locked=true;
            GameExperience.result(correct,{player,combo:correct?s.combo+1:0});
            let prefix;
            if(correct) {s.combo++;const add=10+(s.combo>1?5:0);s.score+=add;prefix=s.combo>1?'修对了！连击奖励 +5 分。':'修对了！';showFloatScore(player,`+${add}`,'#FFD700');}
            else {s.combo=0;const minus=Math.min(5,s.score);s.score-=minus;prefix='再试再练！看看正确的修改：';showFloatScore(player,`-${minus}`,'#e74c3c');s.edit={...q.accepted[0]};}
            renderEditor(player);setControls(player,true);
            feedback.replaceChildren();
            for(const text of [prefix,'正确句子：'+(correct?userResult:q.corrected),q.explanation,'出处：'+q.source]) {const p=document.createElement('p');p.textContent=text;feedback.append(p);}
            document.getElementById(`score-${player}`).textContent=s.score;
            later(()=>{s.index++;loadQuestionForPlayer(player);}, correct ? 2000 : 3000);
        }
        function showFloatScore(player,text,color) {
            const el=document.createElement('div');el.className='float-score';el.textContent=text;el.style.color=color;el.style.left='45%';el.style.top='40%';
            document.getElementById(`panel-${player}`).append(el);later(()=>el.remove(),1500);
        }
        function endGame() { GameExperience.endRound();
            if(isGameOver) return;
            isGameOver=true;clearInterval(timerInterval);pendingTimers.forEach(clearTimeout);pendingTimers.clear();
            [1,2].forEach(p=>setControls(p,true));
            document.getElementById('game-screen').classList.add('hidden');document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('final-score').textContent=`玩家一：${players[1].score} 分 | 玩家二：${players[2].score} 分`;
            const winner=document.getElementById('winner-text'),diff=players[1].score-players[2].score;
            winner.textContent=diff===0?'🤝 势均力敌，平局！':diff>0?'玩家一获胜！':'玩家二获胜！';winner.style.color=diff===0?'#FFD700':diff>0?'#4facfe':'#ff6b81';
        }

    </script>
</body>
