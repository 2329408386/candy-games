<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>标点PK · 中等难度提示语练习</title>
    <style>

        :root {
            --p1-color: #4facfe;
            --p1-bg: #e0f3ff;
            --p2-color: #ff6b81;
            --p2-bg: #ffe5e9;
            --text-dark: #2c3e50;
            --correct: #2ecc71;
            --wrong: #e74c3c;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'ZCOOL KuaiLe', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff; height: 100vh;
            display: flex; flex-direction: column;
            overflow: hidden; user-select: none;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 40px; background: rgba(0,0,0,0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            height: 10vh; min-height: 80px;
        }

        .title { font-size: 2.5rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); color: #FFD700; }
        .timer-box { font-size: 3rem; background: #fff; color: #ff4757; padding: 5px 30px; border-radius: 50px; box-shadow: 0 0 20px rgba(255, 255, 255, 0.5); font-weight: bold; }

        .game-container { display: flex; flex: 1; padding: 15px; gap: 15px; height: 90vh; }
        .player-panel { flex: 1; border-radius: 30px; display: flex; flex-direction: column; padding: 15px; position: relative; transition: all 0.3s ease; }

        .player-1 { background: linear-gradient(180deg, #ffffff 0%, var(--p1-bg) 100%); border: 8px solid var(--p1-color); }
        .player-2 { background: linear-gradient(180deg, #ffffff 0%, var(--p2-bg) 100%); border: 8px solid var(--p2-color); }

        .player-header { display: flex; justify-content: space-between; align-items: center; font-size: 1.8rem; color: var(--text-dark); margin-bottom: 10px; }
        .score-display { font-size: 2.5rem; font-weight: bold; color: #ff4757; background: #fff; padding: 5px 20px; border-radius: 20px; box-shadow: 0 4px 0 #ddd; }

        .rule-tag { background: #f1c40f; color: #fff; padding: 5px 15px; border-radius: 15px; font-size: 1.2rem; display: inline-block; box-shadow: 0 4px 0 #d4ac0d; text-align: center; margin-bottom: 10px; }

        .question-area {
            background: white; border-radius: 20px; padding: 20px; font-size: 2rem; 
            color: var(--text-dark); line-height: 1.8; flex: 1; 
            display: flex; align-items: center; justify-content: center;
            text-align: center; box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
            margin-bottom: 10px; flex-wrap: wrap; align-content: center;
            position: relative;
        }

        .waiting-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); border-radius: 20px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 2.5rem; color: #f39c12; font-weight: bold; z-index: 10;
        }

        .blank {
            display: inline-block; min-width: 50px; height: 50px; border-bottom: 5px solid #aaa;
            margin: 0 5px; vertical-align: middle; cursor: pointer; position: relative;
            transition: all 0.2s; border-radius: 10px 10px 0 0;
            line-height: 50px; font-size: 2rem; padding: 0 5px;
        }
        .blank.active { background-color: rgba(255, 215, 0, 0.3); border-bottom-color: #f1c40f; transform: scale(1.1); }
        .blank.correct { color: var(--correct); border-bottom-color: var(--correct); }
        .blank.wrong { color: var(--wrong); border-bottom-color: var(--wrong); animation: shake 0.5s; }

        .tray-container { display: flex; flex-direction: column; gap: 8px; }
        .punctuation-tray { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        
        .punctuation-btn {
            width: 60px; height: 60px; font-size: 2rem; background: white; border: none;
            border-radius: 12px; cursor: pointer; transition: all 0.1s;
            display: flex; align-items: center; justify-content: center; color: #333;
        }
        .player-1 .punctuation-btn { box-shadow: 0 4px 0 #b3d4fc; }
        .player-2 .punctuation-btn { box-shadow: 0 4px 0 #ffb3c1; }
        .punctuation-btn:active { transform: translateY(4px); box-shadow: 0 0px 0 #ccc; }
        .punctuation-btn:hover { background: #f0f0f0; }

        .action-row { display: flex; gap: 8px; justify-content: center; }
        .action-btn {
            color: white; border: none; padding: 8px 15px; border-radius: 12px; 
            font-size: 1.2rem; font-family: inherit; cursor: pointer; transition: all 0.1s;
            flex: 1;
        }
        .btn-delete { background: #ff9f43; box-shadow: 0 4px 0 #e67e22; }
        .btn-clear { background: #a4b0be; box-shadow: 0 4px 0 #747d8c; }
        .btn-submit { background: #2ecc71; box-shadow: 0 4px 0 #27ae60; font-size: 1.4rem; flex: 2; }
        .action-btn:active { transform: translateY(4px); box-shadow: 0 0px 0 #ccc; }

        .float-score {
            position: absolute; font-size: 3rem; font-weight: bold; color: #FFD700;
            text-shadow: 2px 2px 0 #d35400; pointer-events: none;
            animation: floatUp 1.5s ease-out forwards; z-index: 50;
        }

        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }
        .hidden { display: none !important; }
        .start-btn {
            font-size: 3rem; padding: 20px 60px; border-radius: 50px; background: #f1c40f;
            color: #fff; border: none; cursor: pointer; box-shadow: 0 10px 0 #d4ac0d;
            font-family: inherit; transition: all 0.1s; margin-top: 30px;
        }
        .start-btn:active { transform: translateY(10px); box-shadow: 0 0px 0 #d4ac0d; }

        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-8px); } 100% { transform: translateX(0); } }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(0.5); } 100% { opacity: 0; transform: translateY(-100px) scale(1.5); } }

        /* 与“的地得PK”保持一致：手机上下排列，电脑左右排列。 */
        * { box-sizing: border-box; }
        .header { flex-shrink: 0; height: auto; min-height: 80px; }
        .game-container { height: auto; min-height: 0; }
        .player-panel { min-width: 0; min-height: 0; }
        .question-area { display: block; align-content: center; overflow-y: auto; min-height: 0; }
        .tray-container { flex-shrink: 0; }
        .overlay-screen { position: fixed; overflow-y: auto; padding: 24px; text-align: center; }
        .overlay-screen h1 { font-size: clamp(2rem, 6vw, 5rem) !important; }
        @media (max-width: 900px), (max-height: 700px) {
            .header { padding: 8px 18px; min-height: 60px; }
            .title { font-size: 1.8rem; }
            .timer-box { font-size: 2rem; }
            .header > div:last-child { display: none; }
            .game-container { padding: 8px; gap: 8px; }
            .player-panel { padding: 10px; border-width: 4px; border-radius: 20px; }
            .player-header, .question-area { font-size: 1.4rem; }
            .question-area { padding: 12px; line-height: 2; }
            .score-display { font-size: 1.8rem; padding: 3px 12px; }
            .blank { min-width: 38px; height: 42px; line-height: 36px; font-size: 1.4rem; }
            .action-btn { padding: 8px 4px; font-size: 1rem; }
            .punctuation-btn { width: 56px; height: 48px; }
        }
        @media (max-width: 550px) {
            body { overflow-y: auto; height: auto; min-height: 100vh; }
            .game-container { flex-direction: column; }
            .player-panel { min-height: 380px; }
            .question-area { min-height: 120px; overflow-y: visible; }
            .waiting-overlay { font-size: 1.8rem; }
            .overlay-screen { justify-content: flex-start; }
            .start-btn { font-size: 2rem; padding: 16px 36px; }
            .timer-box { padding: 5px 18px; }
        }
        .question-source { font-size: .9rem; line-height: 1.5; color: #667785; margin-bottom: 10px; }
        .answer-feedback { font-size: 1rem; line-height: 1.6; margin-top: 12px; text-align: left; border-radius: 10px; }
        .answer-feedback:not(:empty) { padding: 10px; }
        .right-feedback { background: #e8f7e9; color: #245833; }
        .wrong-feedback { background: #fff2de; color: #754511; }
        button:disabled { opacity: .55; cursor: default; }
        .question-area { align-content: start; }
        .blank { min-width: 86px; white-space: nowrap; }
        .blank:focus-visible { outline: 2px solid #b98522; outline-offset: 3px; }
        .input-message { font-size: .85rem; line-height: 1.5; min-height: 1.5em; color: #586c7a; margin-top: 14px; text-align: left; }
        @media (max-width: 900px), (max-height: 700px) { .blank { min-width: 68px; } }
    </style>

        let p1Questions = [];

        let p1Score = 0, p2Score = 0;
        let p1Combo = 0, p2Combo = 0; 
        let timeLeft = 150; // 题目增多，时间延长至150秒
        let timerInterval;
        let activeBlanks = { 1: null, 2: null }; 
        let isGameOver = false;
        let gameStarted = false;
        let deadline = 0;
        const submitted = {1: false, 2: false};
        function shuffle(items) {
            const result = [...items];
            for (let i=result.length-1;i>0;i--) {
                const j=Math.floor(Math.random()*(i+1));
                [result[i],result[j]]=[result[j],result[i]];
            }
            return result;
        }
        function sampleRound() {
            const rounds = [[], []];
            // The book contains only two suitable middle-position originals. Use either quota equally, for both players.
            const middleTextbook = Math.random() < .5 ? 0 : 1;
            const quotas = {before:{textbook:6-middleTextbook,extension:1+middleTextbook},middle:{textbook:middleTextbook,extension:6-middleTextbook},after:{textbook:4,extension:3}};
            for (const [position, origins] of Object.entries(quotas)) {
                for (const [origin, count] of Object.entries(origins)) {
                    const pool = shuffle(questionBank.filter(q => q.position === position && q.origin === origin));
                    if (pool.length < count * 2) throw new Error('分类题量不足，请刷新页面。');
                    rounds[0].push(...pool.slice(0,count));
                    rounds[1].push(...pool.slice(count,count*2));
                }
            }
            return rounds.map(shuffle);
        }


        // ================= 游戏初始化 =================
        function startGame() {
            if (gameStarted) return;
            gameStarted = true;
            timeLeft=GameExperience.getDuration();
            const roundDeadline=GameExperience.startRound();
            document.getElementById('timer').textContent=timeLeft+'s';
            deadline = roundDeadline;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            // 双方各20道不同的题，课内、课外各10题；7前6中7后，总计59根横线。
            [p1Questions, p2Questions] = sampleRound();

            // 初始化双方第一题
            loadQuestionForPlayer(1);
            loadQuestionForPlayer(2);
            
            startTimer();
        }

        function loadQuestionForPlayer(player) {
            if (isGameOver) return;

            const questions = player === 1 ? p1Questions : p2Questions;
            const index = player === 1 ? p1Index : p2Index;
            const q = questions[index];
            submitted[player] = false;
            activeBlanks[player] = null;
            document.querySelectorAll(`#tray-container-${player} button`).forEach(b=>b.disabled=!q);

            // 检查该玩家是否已经做完
            if (!q) {
                document.getElementById(`question-${player}`).innerHTML = `<div class="waiting-overlay"> 已完成所有题目<br>等待对手...</div>`;
                document.getElementById(`tray-container-${player}`).style.opacity = '0.3';
                document.getElementById(`tray-container-${player}`).style.pointerEvents = 'none';
                checkGameEnd();
                return;
            }

            document.getElementById(`rule-${player}`).innerText = q.rule;
            const questionArea = document.getElementById(`question-${player}`);
            const tray = document.getElementById(`tray-${player}`);

            // 渲染题目
            let html = q.text.replace(/\[(\d+)\]/g, (match, blankIndex) => {

                return `<span class="blank" role="button" tabindex="0" data-index="${blankIndex}" data-capacity="${capacity}" aria-label="第${Number(blankIndex)+1}格标点填写横线" onclick="activateBlank(${player}, this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();activateBlank(${player},this)}"></span>`;
            });
            questionArea.innerHTML = html;
            const progress = document.createElement('div');
            progress.className = 'question-source';
            progress.textContent = `第 ${index+1} / ${questions.length} 题 · ${q.rule} · ` +
                (q.origin === 'extension' ? '课外·自编例句' : `课内·《${q.source.lesson}》原句`);
            questionArea.prepend(progress);
            const inputMessage = document.createElement('div');
            inputMessage.id = `input-message-${player}`;
            inputMessage.className = 'input-message';
            inputMessage.setAttribute('role','status');
            inputMessage.textContent = '先选横线，再逐个点选标点。';
            questionArea.append(inputMessage);
            const feedback = document.createElement('div');
            feedback.id = `feedback-${player}`;
            feedback.className = 'answer-feedback';
            feedback.setAttribute('role','status');
            questionArea.append(feedback);

            // 渲染标点按钮
            tray.innerHTML = '';
            punctuationOptions.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'punctuation-btn';
                btn.innerText = p;
                btn.onclick = () => appendPunctuation(player, p);
                tray.appendChild(btn);
            });
            
            activeBlanks[player] = null;
        }

        // ================= 交互逻辑 =================
        function inputReady(player) {
            return gameStarted && !isGameOver && !submitted[player] && !GameExperience.expired();
        }
        function inputHint(player, message) {
            const node = document.getElementById(`input-message-${player}`);
            if (node) node.textContent = message;
        }
        function inputCount(player, blank) {
            inputHint(player, '已选中横线，请逐个点选标点。');
        }
        function activateBlank(player, blankElement) {
            if (!inputReady(player)) return;
            document.querySelectorAll(`#panel-${player} .blank`).forEach(b => b.classList.remove('active'));
            blankElement.classList.add('active');
            activeBlanks[player] = blankElement;
            inputCount(player,blankElement);
        }
        function appendPunctuation(player, punctuation) {
            if (!inputReady(player) || !activeBlanks[player]) return;
            if (!punctuationOptions.includes(punctuation) || Array.from(punctuation).length !== 1) return;
            const blank = activeBlanks[player], capacity = Number(blank.dataset.capacity);
            const existing = Array.from(blank.textContent);
            if (capacity === 1) blank.textContent = punctuation;
            else if (existing.length < capacity) blank.textContent += punctuation;
            else { inputHint(player,'请先删除，再修改标点。'); return; }
            inputCount(player,blank);
        }
        function deleteChar(player) {
            if (!inputReady(player) || !activeBlanks[player]) return;
            const blank = activeBlanks[player];
            blank.textContent = Array.from(blank.textContent).slice(0,-1).join('');

            const available = player === 1 ? p1Questions : p2Questions;

            if (!available[position]) return;
            
            const blanks = document.querySelectorAll(`#panel-${player} .blank`);
            const incomplete = Array.from(blanks).findIndex(b => Array.from(b.textContent.trim()).length !== Number(b.dataset.capacity));
            if (incomplete >= 0) {
                const blank = blanks[incomplete], count = Array.from(blank.textContent.trim()).length, capacity = Number(blank.dataset.capacity);

            const userAnswers = Array.from(blanks, b => b.innerText.trim());
            const alternatives = q.acceptedAnswers || [q.answers];
            const matching = alternatives.find(a => a.length === userAnswers.length && a.every((v,i) => v === userAnswers[i]));
            const matchCount = a => a.reduce((n,v,i) => n + Number(v === userAnswers[i]),0);
            const expectedAnswers = matching || alternatives.reduce((best,a) => matchCount(a) > matchCount(best) ? a : best,q.answers);
            let correctCount = 0;

            blanks.forEach((b, i) => {
                const userAnswer = b.innerText.trim();
                const correctAnswer = expectedAnswers[i].trim();
                
                if (userAnswer === correctAnswer) {
                    b.classList.add('correct');

                } else {
                    b.classList.add('wrong');
                }

            const isAllCorrect = (correctCount === q.answers.length);
            GameExperience.result(isAllCorrect,{player,combo:isAllCorrect?(player===1?p1Combo:p2Combo)+1:0});

                let comboBonus = (player === 1 ? p1Combo : p2Combo) > 1 ? 5 : 0; 
                let totalAdd = baseScore + comboBonus;
                
                if (player === 1) p1Score += totalAdd; else p2Score += totalAdd;
                showFloatScore(player, `+${totalAdd}`, "#FFD700");
                if (comboBonus > 0) setTimeout(() => showFloatScore(player, " 连击!", "#ff9f43"), 300);
            } else {
                if (player === 1) p1Combo = 0; else p2Combo = 0; 
                if (player === 1) p1Score = Math.max(0, p1Score - 5); else p2Score = Math.max(0, p2Score - 5);
                showFloatScore(player, "-5", "#e74c3c");

                setTimeout(() => {
                    blanks.forEach((b, i) => {
                        if (b.innerText.trim() !== expectedAnswers[i]) {
                            b.innerText = expectedAnswers[i];
                        }
                    });
                }, 800);
            }

            updateScoreboard();

            const tray = document.getElementById(`tray-container-${player}`);
            tray.style.opacity = '0.3';
            tray.style.pointerEvents = 'none';

            setTimeout(() => {
                if (isGameOver) return;
                tray.style.opacity = '1';
                tray.style.pointerEvents = 'auto';
                
                if (player === 1) p1Index++; else p2Index++;
                loadQuestionForPlayer(player);
            }, isAllCorrect ? 2000 : 3000);
        }

        // ================= 视觉与辅助函数 =================
        function showFloatScore(player, text, color) {
            const panel = document.getElementById(`panel-${player}`);
            const rect = panel.getBoundingClientRect();
            const el = document.createElement('div');
            el.className = 'float-score';
            el.innerText = text;
            el.style.color = color;
            el.style.left = `${rect.width / 2 + (Math.random() * 100 - 50)}px`;
            el.style.top = `40%`;
            panel.appendChild(el);
            setTimeout(() => el.remove(), 1500);
        }

        function updateScoreboard() {
            document.getElementById('score-1').innerText = p1Score;
            document.getElementById('score-2').innerText = p2Score;
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
                document.getElementById('timer').innerText = timeLeft + 's';
                if (timeLeft <= 10) document.getElementById('timer').style.color = "#ff4757";
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        function checkGameEnd() {
            if (p1Index >= p1Questions.length && p2Index >= p2Questions.length) {
                endGame();
            }
        }

        function endGame() { GameExperience.endRound();
            if (isGameOver) return;
            isGameOver = true;
            clearInterval(timerInterval);
            
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');

            const winnerText = document.getElementById('winner-text');
            const finalScore = document.getElementById('final-score');
            finalScore.innerText = `玩家一：${p1Score} 分  |  玩家二：${p2Score} 分`;
            
            if (p1Score > p2Score) {
                winnerText.innerText = " 玩家一获胜！";
                winnerText.style.color = "#4facfe";
            } else if (p2Score > p1Score) {
                winnerText.innerText = " 玩家二获胜！";
                winnerText.style.color = "#ff6b81";
            } else {
                winnerText.innerText = "🤝 势均力敌，平局！🤝";
                winnerText.style.color = "#FFD700";
            }
        }
    </script>
</body>
</html>
