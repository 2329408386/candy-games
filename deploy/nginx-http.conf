# /etc/nginx/conf.d/candy-games.conf (http context)
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# Fingerprinted files (name.<sha8>.ext, or any ?v=) never change, so cache them for a year;
# everything else is revalidated with ETag on every use.
map $arg_v $candy_versioned_cache {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}
map $uri $candy_static_cache {
    "~\.[0-9a-f]{8}\.(mp3|webp|jpe?g|png|svg|gif|woff2)$" "public, max-age=31536000, immutable";
    default $candy_versioned_cache;
}
