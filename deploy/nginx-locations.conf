# /etc/nginx/snippets/candy-games-locations.conf: every location of the site, shared by the http (nginx-site.conf)
# and https (nginx-tls.conf) servers so both serve exactly the same thing.
location ^~ /static/game-audio-v3/      { alias /opt/candy-games/current/shared-static/game-audio-v3/; include snippets/candy-games-static.conf; }
location ^~ /math/static/game-audio-v3/ { alias /opt/candy-games/current/shared-static/game-audio-v3/; include snippets/candy-games-static.conf; }
location ^~ /english/static/game-audio-v3/ { alias /opt/candy-games/current/shared-static/game-audio-v3/; include snippets/candy-games-static.conf; }
location ^~ /static/shared/      { alias /opt/candy-games/current/shared-static/; include snippets/candy-games-static.conf; }
location ^~ /math/static/shared/ { alias /opt/candy-games/current/shared-static/; include snippets/candy-games-static.conf; }
location ^~ /english/static/shared/ { alias /opt/candy-games/current/shared-static/; include snippets/candy-games-static.conf; }
location ^~ /static/      { alias /opt/candy-games/current/sites/chinese/static/; include snippets/candy-games-static.conf; }
location ^~ /math/static/ { alias /opt/candy-games/current/sites/math/static/; include snippets/candy-games-static.conf; }
location ^~ /english/static/ { alias /opt/candy-games/current/sites/english/static/; include snippets/candy-games-static.conf; }
location ^~ /workspace/chinese/static/shared/ { alias /opt/candy-games/current/shared-static/; include snippets/candy-games-static.conf; }
location ^~ /workspace/chinese/static/ { alias /opt/candy-games/current/sites/teacher/static/; include snippets/candy-games-static.conf; }

location = /math { return 301 /math/; }
location = /english { return 301 /english/; }
# One app serves all four sites; "/math", "/english" and "/workspace/chinese" are routed inside the app, so the path is
# passed through unchanged. The app also redirects the workbench's old address /teacher/… to /workspace/chinese/.
location / {
    proxy_pass http://127.0.0.1:18082;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 35s;
}

# 读句子 recordings: up to 10 s of 16 kHz 16-bit PCM (320 KB); everything else stays under the 8k limit.
location ^~ /english/api/speech/ {
    client_max_body_size 400k;
    proxy_pass http://127.0.0.1:18082;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 35s;
}

# 语文老师工作台: essays, review edits and up to three photos of a handwritten essay (compressed in the browser to
# well under 1 MB each; the app refuses more than 30 MB).
location ^~ /workspace/ {
    client_max_body_size 30m;
    proxy_pass http://127.0.0.1:18082;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 35s;
}
