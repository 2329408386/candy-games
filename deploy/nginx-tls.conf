# /etc/nginx/sites-available/candy-games-tls: https on the bare IP. install.sh enables it only once the
# Let's Encrypt certificate exists (install.sh cert), so nginx never fails over a missing file.
# http keeps working as before; https is needed for the microphone (读句子).
server {
    # nginx 1.24 (Ubuntu 24.04): http2 is a listen parameter; "http2 on;" needs 1.25.1+.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 39.106.16.99;
    server_tokens off;
    client_max_body_size 8k;
    access_log off;

    ssl_certificate     /etc/letsencrypt/live/candy-games/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/candy-games/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:candy_tls:2m;
    ssl_session_timeout 1d;

    include snippets/candy-games-locations.conf;
}
