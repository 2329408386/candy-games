# /etc/nginx/sites-available/candy-games
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 39.106.16.99;
    server_tokens off;
    client_max_body_size 8k;
    access_log off;

    location ^~ /static/game-audio-v3/      { alias /opt/candy-games/shared-static/game-audio-v3/; include snippets/candy-games-static.conf; }
    location ^~ /math/static/game-audio-v3/ { alias /opt/candy-games/shared-static/game-audio-v3/; include snippets/candy-games-static.conf; }
    location ^~ /static/      { alias /opt/candy-games/sites/chinese/static/; include snippets/candy-games-static.conf; }
    location ^~ /math/static/ { alias /opt/candy-games/sites/math/static/; include snippets/candy-games-static.conf; }

    location = /math { return 301 /math/; }
    # One app serves both sites; "/math" is routed inside the app, so the path is passed through unchanged.
    location / {
        proxy_pass http://127.0.0.1:18082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }
}
