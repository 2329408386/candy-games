# /etc/nginx/sites-available/candy-games
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 39.106.16.99;
    server_tokens off;
    client_max_body_size 8k;
    access_log off;

    # Let's Encrypt HTTP-01 challenges for the IP certificate (see install.sh cert).
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }
    include snippets/candy-games-locations.conf;
}
